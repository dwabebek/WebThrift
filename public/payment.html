<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pembayaran - Thrift Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-zinc-900 p-8 rounded-3xl border border-zinc-800">
      <h2 class="text-2xl font-black mb-6">Instruksi Pembayaran</h2>

      <div id="dynamicPayment" class="bg-zinc-950 p-6 rounded-2xl border border-emerald-900 mb-6 text-center">
        <p class="text-xs font-bold text-zinc-500 uppercase mb-2">Metode Anda</p>
        <h3 id="methodName" class="text-2xl font-black text-emerald-500 mb-4">...</h3>
        <p class="text-sm text-zinc-400">Silakan transfer ke nomor berikut:</p>
        <p id="accountNumber" class="text-xl font-bold text-white mt-2"></p>
      </div>

      <label class="block text-xs font-bold text-zinc-400 mb-2">UPLOAD BUKTI TRANSFER</label>
      <input type="file" id="proofFile" accept="image/*" class="w-full mb-4 text-sm bg-zinc-800 p-2 rounded" />

      <div id="paymentMessage" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm font-bold"></div>

      <button id="submitPaymentBtn" onclick="submitPayment()" class="w-full bg-emerald-500 text-zinc-950 font-black py-3 rounded-xl hover:bg-emerald-400 disabled:cursor-not-allowed disabled:bg-zinc-700 disabled:text-zinc-400">
        KIRIM BUKTI
      </button>
    </div>

    <script>
      let currentOrder = null;

      function showMessage(message, type = "success") {
        const messageBox = document.getElementById("paymentMessage");
        const isSuccess = type === "success";

        messageBox.textContent = message;
        messageBox.className = `mb-4 rounded-xl border px-4 py-3 text-sm font-bold ${isSuccess ? "border-emerald-500/30 bg-emerald-500/10 text-emerald-400" : "border-red-500/30 bg-red-500/10 text-red-400"}`;
      }

      function getOrderId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("order") || localStorage.getItem("thrift_current_order_id");
      }

      function syncLocalOrder(order) {
        const orderHistory = JSON.parse(localStorage.getItem("thrift_orders")) || [];
        const existingIndex = orderHistory.findIndex((item) => item.id === order.id);

        if (existingIndex === -1) {
          orderHistory.push(order);
        } else {
          orderHistory[existingIndex] = order;
        }

        localStorage.setItem("thrift_orders", JSON.stringify(orderHistory));
        localStorage.setItem("thrift_current_order_id", order.id);
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Terjadi kesalahan pada server.");
        }

        return data;
      }

      function getAdminWhatsAppUrl(order) {
        const adminNumber = "6285924845011";
        const message = encodeURIComponent(`Halo Admin Thrift Lab, saya sudah mengirim bukti pembayaran untuk pesanan ${order.id} dengan total ${order.total_label || order.total}. Mohon diproses ya.`);

        return `https://wa.me/${adminNumber}?text=${message}`;
      }

      function showPaymentSuccess(order) {
        const messageBox = document.getElementById("paymentMessage");
        const whatsappUrl = getAdminWhatsAppUrl(order);

        messageBox.className = "mb-4 rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-4 text-sm text-emerald-400";
        messageBox.innerHTML = `
          <p class="font-bold">Bukti pembayaran berhasil dikirim.</p>
          <p class="mt-1 text-emerald-300/90">Hubungi admin untuk proses selanjutnya.</p>
          <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="mt-4 block w-full rounded-xl bg-emerald-500 px-4 py-3 text-center font-black text-zinc-950 hover:bg-emerald-400">
            HUBUNGI ADMIN VIA WHATSAPP
          </a>
          <button type="button" onclick="window.location.href = '/'" class="mt-3 w-full rounded-xl border border-zinc-700 px-4 py-3 text-center font-bold text-zinc-200 hover:border-zinc-500 hover:text-white">
            KEMBALI KE BERANDA
          </button>
        `;
      }

      async function loadPaymentOrder() {
        const orderId = getOrderId();

        if (!orderId) {
          showMessage("Data pesanan tidak ditemukan. Anda akan diarahkan ke halaman utama.", "error");
          setTimeout(() => {
            window.location.href = "/";
          }, 1800);
          return;
        }

        try {
          const data = await requestJson(`/api/orders/${encodeURIComponent(orderId)}`);
          currentOrder = data.order;
          syncLocalOrder(currentOrder);
        } catch (error) {
          showMessage(error.message || "Data pesanan tidak ditemukan.", "error");
          return;
        }

        // Konfigurasi data metode
        const configs = {
          BCA: "1234567890 (a.n Thrift Lab)",
          BRI: "592501051849537 (a.n Thrift Lab)",
          DANA: "0895341355115 (Thrift Lab)",
          OVO: "0895341355115 (Thrift Lab)",
          SHOPEE: "0895341355115 (Thrift Lab)",
        };

        document.getElementById("methodName").textContent = currentOrder.paymentMethod;
        document.getElementById("accountNumber").textContent = configs[currentOrder.paymentMethod] || "Hubungi admin untuk detail pembayaran";

        if (currentOrder.status === "pending_verification" || currentOrder.status === "success") {
          document.getElementById("submitPaymentBtn").disabled = true;
          document.getElementById("submitPaymentBtn").textContent = "BUKTI TERKIRIM";
          showPaymentSuccess(currentOrder);
        }
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();

          reader.onload = (event) => resolve(event.target.result);
          reader.onerror = () => reject(new Error("Bukti transfer gagal dibaca. Coba pilih file lain."));
          reader.readAsDataURL(file);
        });
      }

      async function submitPayment() {
        const proofInput = document.getElementById("proofFile");
        const submitButton = document.getElementById("submitPaymentBtn");
        const file = proofInput.files[0];

        if (!currentOrder) {
          showMessage("Data pesanan belum siap. Muat ulang halaman ini.", "error");
          return;
        }

        if (!file) {
          showMessage("Silakan pilih gambar bukti transfer terlebih dahulu.", "error");
          proofInput.focus();
          return;
        }

        if (!file.type.startsWith("image/")) {
          showMessage("Bukti transfer harus berupa gambar.", "error");
          proofInput.value = "";
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          showMessage("Ukuran bukti transfer maksimal 15 MB.", "error");
          proofInput.value = "";
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "MENGIRIM...";

        try {
          const proof = await readFileAsDataUrl(file);
          const data = await requestJson(`/api/orders/${encodeURIComponent(currentOrder.id)}/proof`, {
            method: "PUT",
            body: JSON.stringify({
              proof,
              proof_name: file.name,
            }),
          });

          currentOrder = data.order;
          syncLocalOrder(currentOrder);
          localStorage.removeItem("thrift_cart");

          submitButton.textContent = "BUKTI TERKIRIM";
          showPaymentSuccess(currentOrder);
        } catch (error) {
          submitButton.disabled = false;
          submitButton.textContent = "KIRIM BUKTI";
          showMessage(error.message || "Bukti transfer gagal dikirim.", "error");
        }
      }

      window.onload = loadPaymentOrder;
    </script>
  </body>
</html>
