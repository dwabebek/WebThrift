<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Tambah Produk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h1 class="text-2xl font-bold mb-6 text-slate-800">Tambah Inventori Baru</h1>
      <form id="addForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Pakaian</label>
          <input type="text" id="name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:border-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori</label>
            <select id="category" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <option value="baju">Baju</option>
              <option value="celana">Celana</option>
              <option value="sepatu">Sepatu</option>
              <option value="tas">Tas</option>
              <option value="topi">Topi</option>
              <option value="jaket">Jaket</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Ukuran</label>
            <input type="text" id="size" placeholder="S/M/L/42/AllSize" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Harga (Rp)</label>
          <input type="number" id="price" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>

        <input type="text" name="name" id="condition_input" style="display: none" />
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Kondisi Barang</label>
          <input type="text" id="condition" required placeholder="Contoh: 9/10 Mulus" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">URL Gambar</label>
          <input type="url" id="imageUrl" placeholder="https://..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>

        <div class="pt-4 flex justify-end gap-3">
          <a href="/admin.html" class="border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold text-slate-600">Batal</a>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-sm">Simpan</button>
        </div>
      </form>
    </div>
    <script>
      document.getElementById("addForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById("name").value,
          category: document.getElementById("category").value,
          price: document.getElementById("price").value,
          size: document.getElementById("size").value,
          condition: document.getElementById("condition").value,
          image_url: document.getElementById("imageUrl").value,
        };
        await fetch("/api/products", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        window.location.href = "/admin.html";
      });
    </script>
  </body>
</html>
