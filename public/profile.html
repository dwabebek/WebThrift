<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrift Lab - Profil Akun</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">
    <script>
      function getCurrentUser() {
        try {
          const user = JSON.parse(localStorage.getItem("thrift_current_user")) || null;

          if (user && user.profile_photo) {
            delete user.profile_photo;
            localStorage.setItem("thrift_current_user", JSON.stringify(user));
          }

          return user;
        } catch (error) {
          localStorage.removeItem("thrift_current_user");
          return null;
        }
      }

      const currentUser = getCurrentUser();

      if (!currentUser) {
        alert("Silakan login terlebih dahulu.");
        window.location.href = "/login.html";
      }
    </script>

    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
      <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-black tracking-tighter text-emerald-500 italic">THRIFT.LAB</a>
        <div class="flex items-center gap-4 text-sm font-bold">
          <a href="/" class="text-zinc-400 hover:text-emerald-500 transition">Lihat Katalog</a>
          <button type="button" onclick="logoutUser()" class="text-red-400 hover:text-red-300 transition">Logout</button>
        </div>
      </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-10 md:py-14 w-full flex-grow">
      <div class="mb-8">
        <p class="text-xs font-black uppercase tracking-[0.25em] text-emerald-500">Akun Saya</p>
        <h1 class="text-3xl md:text-4xl font-black mt-2">Profil Pengguna</h1>
      </div>

      <div id="alertMessage" class="hidden mb-6 rounded-2xl border px-5 py-4 text-sm font-bold"></div>

      <div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6">
        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 h-fit">
          <div class="flex flex-col items-center text-center">
            <div class="relative">
              <div id="photoFallback" class="flex h-36 w-36 items-center justify-center rounded-full bg-emerald-500 text-5xl font-black text-zinc-950"></div>
              <img id="photoPreview" alt="Foto profil" class="hidden h-36 w-36 rounded-full object-cover border-4 border-zinc-800" />
            </div>
            <h2 id="profileDisplayName" class="mt-5 text-xl font-black text-zinc-100 break-words"></h2>
            <p id="profileUsername" class="mt-1 text-sm text-zinc-500 break-all"></p>

            <label for="profilePhoto" class="mt-6 w-full cursor-pointer bg-zinc-100 text-zinc-950 py-3 rounded-xl text-sm font-black hover:bg-emerald-500 transition"> PILIH FOTO </label>
            <input id="profilePhoto" type="file" accept="image/*" class="hidden" />

            <button id="removePhotoBtn" type="button" class="mt-3 hidden w-full border border-zinc-700 text-zinc-300 py-3 rounded-xl text-sm font-bold hover:border-red-500 hover:text-red-400 transition">HAPUS FOTO</button>
          </div>
        </section>

        <section class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 md:p-8">
          <form id="profileForm" class="space-y-5">
            <div>
              <label for="username" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Username</label>
              <input id="username" type="text" disabled class="w-full bg-zinc-950 border border-zinc-800 text-zinc-500 px-4 py-3 rounded-xl text-sm cursor-not-allowed" />
            </div>

            <div>
              <label for="fullName" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Nama Lengkap</label>
              <input
                id="fullName"
                type="text"
                required
                placeholder="Nama lengkap"
                class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition"
              />
            </div>

            <div>
              <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Nomor HP / WhatsApp</label>
              <input
                id="phone"
                type="tel"
                required
                placeholder="Contoh: 08123456789"
                class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition"
              />
            </div>

            <div>
              <label for="address" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Alamat Pengiriman</label>
              <textarea
                id="address"
                required
                rows="4"
                placeholder="Alamat lengkap"
                class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition resize-none"
              ></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Password Baru</label>
                <input
                  id="password"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Opsional"
                  class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition"
                />
              </div>
              <div>
                <label for="passwordConfirm" class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">Konfirmasi Password</label>
                <input
                  id="passwordConfirm"
                  type="password"
                  autocomplete="new-password"
                  placeholder="Ulangi password"
                  class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition"
                />
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
              <button id="saveBtn" type="submit" class="flex-1 bg-emerald-500 text-zinc-950 font-black py-3 rounded-xl text-sm tracking-wide hover:bg-emerald-400 active:scale-[0.98] transition shadow-lg shadow-emerald-500/10">
                SIMPAN PROFIL
              </button>
              <a href="/" class="flex-1 text-center border border-zinc-700 text-zinc-300 font-bold py-3 rounded-xl text-sm hover:border-zinc-500 hover:text-white transition">BATAL</a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script>
      let profilePhotoData = "";
      const apiOrigin = window.location.origin === "http://localhost:3000" ? "" : "http://localhost:3000";

      const alertBox = document.getElementById("alertMessage");
      const photoInput = document.getElementById("profilePhoto");
      const photoPreview = document.getElementById("photoPreview");
      const photoFallback = document.getElementById("photoFallback");
      const removePhotoBtn = document.getElementById("removePhotoBtn");
      const saveBtn = document.getElementById("saveBtn");

      function setAlert(message, type = "success") {
        const isSuccess = type === "success";

        alertBox.textContent = message;
        alertBox.className = `mb-6 rounded-2xl border px-5 py-4 text-sm font-bold ${isSuccess ? "border-emerald-500/30 bg-emerald-500/10 text-emerald-400" : "border-red-500/30 bg-red-500/10 text-red-400"}`;
      }

      function clearAlert() {
        alertBox.textContent = "";
        alertBox.className = "hidden mb-6 rounded-2xl border px-5 py-4 text-sm font-bold";
      }

      function getInitial(name) {
        const source = String(name || currentUser.username || "?").trim();
        return source.charAt(0).toUpperCase();
      }

      function updatePhotoPreview(photoData, name) {
        profilePhotoData = photoData || "";
        photoFallback.textContent = getInitial(name);

        if (profilePhotoData) {
          photoPreview.src = profilePhotoData;
          photoPreview.classList.remove("hidden");
          photoFallback.classList.add("hidden");
          removePhotoBtn.classList.remove("hidden");
        } else {
          photoPreview.removeAttribute("src");
          photoPreview.classList.add("hidden");
          photoFallback.classList.remove("hidden");
          removePhotoBtn.classList.add("hidden");
        }
      }

      function renderProfile(user) {
        const displayName = user.full_name || user.username;

        document.getElementById("username").value = user.username || "";
        document.getElementById("fullName").value = user.full_name || "";
        document.getElementById("phone").value = user.phone || "";
        document.getElementById("address").value = user.address || "";
        document.getElementById("profileDisplayName").textContent = displayName;
        document.getElementById("profileUsername").textContent = `@${user.username}`;
        updatePhotoPreview(user.profile_photo || "", displayName);
      }

      function syncLocalUser(user) {
        localStorage.setItem(
          "thrift_current_user",
          JSON.stringify({
            username: user.username || currentUser.username,
            role: user.role || currentUser.role || "customer",
            full_name: user.full_name || "",
            phone: user.phone || "",
            address: user.address || "",
          }),
        );
      }

      function getApiUrl(path) {
        return `${apiOrigin}${path}`;
      }

      async function readJsonResponse(response) {
        const contentType = response.headers.get("content-type") || "";
        const responseText = await response.text();

        if (!contentType.includes("application/json")) {
          if (response.status === 413) {
            throw new Error("Data profil terlalu besar. Pilih foto profil yang ukurannya lebih kecil.");
          }

          throw new Error("Request profil tidak menerima JSON. Pastikan halaman dibuka dari http://localhost:3000/profile.html dan server Node sudah direstart.");
        }

        try {
          return JSON.parse(responseText);
        } catch (error) {
          throw new Error("Respons server profil tidak valid. Coba restart server Node.");
        }
      }

      async function loadProfile() {
        try {
          const response = await fetch(getApiUrl(`/api/profile/${encodeURIComponent(currentUser.username)}`));
          const data = await readJsonResponse(response);

          if (!response.ok || !data.success) {
            throw new Error(data.message || "Profil tidak ditemukan.");
          }

          renderProfile(data.user);
          syncLocalUser(data.user);
        } catch (error) {
          setAlert(error.message || "Gagal memuat profil.", "error");
          renderProfile(currentUser);
        }
      }

      photoInput.addEventListener("change", (event) => {
        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
          setAlert("File harus berupa gambar.", "error");
          photoInput.value = "";
          return;
        }

        if (file.size > 15 * 1024 * 1024) {
          setAlert("Ukuran foto maksimal 15 MB.", "error");
          photoInput.value = "";
          return;
        }

        const reader = new FileReader();

        reader.onload = (readerEvent) => {
          clearAlert();
          updatePhotoPreview(readerEvent.target.result, document.getElementById("fullName").value);
        };

        reader.onerror = () => {
          setAlert("Foto gagal dibaca. Coba pilih file lain.", "error");
        };

        reader.readAsDataURL(file);
      });

      removePhotoBtn.addEventListener("click", () => {
        photoInput.value = "";
        updatePhotoPreview("", document.getElementById("fullName").value);
      });

      document.getElementById("fullName").addEventListener("input", (event) => {
        const displayName = event.target.value || currentUser.username;
        document.getElementById("profileDisplayName").textContent = displayName;
        photoFallback.textContent = getInitial(displayName);
      });

      document.getElementById("profileForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearAlert();

        const password = document.getElementById("password").value;
        const passwordConfirm = document.getElementById("passwordConfirm").value;

        if (password || passwordConfirm) {
          if (password.length < 6) {
            setAlert("Password baru minimal 6 karakter.", "error");
            return;
          }

          if (password !== passwordConfirm) {
            setAlert("Konfirmasi password tidak sama.", "error");
            return;
          }
        }

        const payload = {
          full_name: document.getElementById("fullName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          address: document.getElementById("address").value.trim(),
          profile_photo: profilePhotoData,
        };

        if (password) {
          payload.password = password;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "MENYIMPAN...";

        try {
          const response = await fetch(getApiUrl(`/api/profile/${encodeURIComponent(currentUser.username)}`), {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await readJsonResponse(response);

          if (!response.ok || !data.success) {
            throw new Error(data.message || "Profil gagal diperbarui.");
          }

          document.getElementById("password").value = "";
          document.getElementById("passwordConfirm").value = "";
          renderProfile(data.user);
          syncLocalUser(data.user);
          setAlert(data.message || "Profil berhasil diperbarui.");
        } catch (error) {
          setAlert(error.message || "Profil gagal diperbarui.", "error");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "SIMPAN PROFIL";
        }
      });

      function logoutUser() {
        localStorage.removeItem("thrift_current_user");
        window.location.href = "/login.html";
      }

      if (currentUser) {
        loadProfile();
      }
    </script>
  </body>
</html>
