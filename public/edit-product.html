<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Produk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-md w-full rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
      <h1 class="text-2xl font-bold mb-6 text-slate-800">Edit Data Item</h1>
      <form id="editForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Pakaian</label>
          <input type="text" id="name" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Kategori</label>
            <select id="category" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <option value="baju">Baju</option>
              <option value="celana">Celana</option>
              <option value="sepatu">Sepatu</option>
              <option value="tas">Tas</option>
              <option value="topi">Topi</option>
              <option value="jaket">Jaket</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Ukuran</label>
            <input type="text" id="size" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Harga (Rp)</label>
          <input type="number" id="price" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Kondisi</label>
          <input type="text" id="condition" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Status Barang</label>
          <select id="status" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50">
            <option value="available">Tersedia (Available)</option>
            <option value="sold">Terjual (Sold)</option>
          </select>
        </div>

        <div class="pt-4 flex justify-end gap-3">
          <a href="/admin.html" class="border border-slate-300 px-4 py-2 rounded-lg text-sm font-semibold text-slate-600">Batal</a>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-sm">Perbarui Data</button>
        </div>
      </form>
    </div>
    <script>
      const productId = localStorage.getItem("editProductId");
      async function fetchDetail() {
        const res = await fetch(`/api/products/${productId}`);
        const p = await res.json();
        document.getElementById("name").value = p.name;
        document.getElementById("category").value = p.category;
        document.getElementById("size").value = p.size;
        document.getElementById("price").value = p.price;
        document.getElementById("condition").value = p.condition;
        document.getElementById("status").value = p.status;
      }
      document.getElementById("editForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const payload = {
          name: document.getElementById("name").value,
          category: document.getElementById("category").value,
          size: document.getElementById("size").value,
          price: document.getElementById("price").value,
          condition: document.getElementById("condition").value,
          status: document.getElementById("status").value,
        };
        await fetch(`/api/products/${productId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        window.location.href = "/admin.html";
      });
      fetchDetail();
    </script>
  </body>
</html>
