<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout Produk</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-50 font-sans min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm border-b border-slate-200 py-4 text-center">
      <a href="/" class="text-xl font-black text-slate-800">THRIFT.<span class="text-indigo-600">LAB</span> - Aman & Terpercaya</a>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-xl font-bold text-slate-800 mb-6">Detail Pengiriman</h2>
        <form id="checkoutForm" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Penerima</label>
            <input type="text" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Nomor WhatsApp</label>
            <input type="number" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Alamat Lengkap</label>
            <textarea required rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Metode Pembayaran</label>
            <select class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
              <option>Transfer Bank (BCA)</option>
              <option>E-Wallet (GoPay / DANA)</option>
              <option>COD (Bayar di Tempat)</option>
            </select>
          </div>
        </form>
      </div>

      <div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-4 sticky top-6">
          <h2 class="text-xl font-bold text-slate-800 mb-4">Ringkasan Pesanan</h2>
          <div id="productSummary" class="flex gap-4 border-b border-slate-200 pb-4 mb-4">
            <p class="text-slate-500 text-sm">Memuat detail produk...</p>
          </div>

          <div class="space-y-2 mb-6">
            <div class="flex justify-between text-sm text-slate-600">
              <p>Subtotal</p>
              <p id="subtotal">Rp 0</p>
            </div>
            <div class="flex justify-between text-sm text-slate-600">
              <p>Ongkos Kirim (Flat)</p>
              <p>Rp 15.000</p>
            </div>
            <div class="flex justify-between text-lg font-black text-slate-800 pt-2 border-t border-slate-200">
              <p>Total Bayar</p>
              <p id="totalPrice">Rp 0</p>
            </div>
          </div>

          <button onclick="processCheckout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-sm text-lg">Bayar & Proses Pesanan</button>
          <a href="/" class="block text-center text-sm text-slate-500 hover:text-slate-800 mt-4">&larr; Kembali ke Katalog</a>
        </div>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");

      if (!productId) {
        alert("Produk tidak valid!");
        window.location.href = "/";
      }

      async function loadProductDetails() {
        const res = await fetch(`/api/products/${productId}`);
        if (!res.ok) {
          alert("Produk mungkin sudah terjual.");
          window.location.href = "/";
        }

        const p = await res.json();
        const total = p.price + 15000;

        document.getElementById("productSummary").innerHTML = `
                <img src="${p.image_url}" class="w-20 h-20 object-cover rounded-lg">
                <div>
                    <h3 class="font-bold text-slate-800 leading-tight">${p.name}</h3>
                    <p class="text-xs text-slate-500 mt-1 uppercase">${p.category} • Size: ${p.size}</p>
                    <p class="font-semibold text-slate-800 mt-1">Rp ${p.price.toLocaleString("id-ID")}</p>
                </div>`;
        document.getElementById("subtotal").textContent = `Rp ${p.price.toLocaleString("id-ID")}`;
        document.getElementById("totalPrice").textContent = `Rp ${total.toLocaleString("id-ID")}`;
      }

      async function processCheckout() {
        const form = document.getElementById("checkoutForm");
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        const res = await fetch(`/api/products/checkout/${productId}`, { method: "POST" });
        const data = await res.json();

        if (data.success) {
          alert("Pesanan Berhasil Dibuat! Barang ini sekarang menjadi milik Anda.");
          window.location.href = "/";
        } else {
          alert("Gagal memproses pesanan.");
        }
      }

      loadProductDetails();
    </script>
  </body>
</html>
