<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrift Lab - Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50 text-center py-4">
      <h1 class="text-2xl font-black tracking-tighter text-emerald-500 italic">THRIFT.LAB - SECURE CHECKOUT</h1>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12 w-full flex-grow">
      <div id="alertMessage" class="hidden mb-6"></div>

      <div class="flex flex-col md:flex-row gap-8">
        <div class="w-full md:w-2/3 bg-zinc-900 border border-zinc-800 rounded-3xl p-6 md:p-8 shadow-2xl">
          <h2 class="text-xl font-bold mb-6 text-zinc-100 border-b border-zinc-800 pb-4">Informasi Pengiriman</h2>
          <form id="checkoutForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">Nama Penerima</label>
                <input type="text" id="custName" required class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" />
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">No. WhatsApp</label>
                <input type="tel" id="custPhone" required class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">Alamat Lengkap (Beserta Kode Pos)</label>
              <textarea
                id="custAddress"
                required
                rows="3"
                class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 resize-none"
              ></textarea>
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-zinc-400 mb-1">Metode Pembayaran</label>
              <select id="paymentMethod" class="w-full bg-zinc-950 border border-zinc-700 text-zinc-100 px-4 py-3 rounded-xl text-sm focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20">
                <option value="BCA">Transfer Bank (BCA)</option>
                <option value="BRI">Transfer Bank (BRI)</option>
                <option value="DANA">Transfer DANA</option>
                <option value="OVO">Transfer OVO</option>
                <option value="SHOPEE">Transfer ShopeePay</option>
              </select>
            </div>
          </form>
        </div>

        <div class="w-full md:w-1/3">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 md:p-8 sticky top-24 shadow-2xl">
            <h3 class="font-bold text-lg mb-4 text-zinc-100">Total Pembayaran</h3>
            <div id="checkoutItems" class="space-y-3 mb-4 max-h-40 overflow-y-auto pr-2 no-scrollbar border-b border-zinc-800 pb-4"></div>
            <div class="flex justify-between text-sm text-zinc-400 mb-2">
              <span>Subtotal Barang</span>
              <span id="checkoutSubtotal" class="font-bold text-zinc-100">Rp 0</span>
            </div>
            <div class="flex justify-between text-sm text-zinc-400 mb-4">
              <span>Ongkos Kirim (Flat)</span>
              <span class="font-bold text-zinc-100">Rp 15.000</span>
            </div>
            <div class="border-t border-zinc-800 my-4"></div>
            <div class="flex justify-between items-center mb-8">
              <span class="font-bold">Total Bayar</span>
              <span id="checkoutTotal" class="text-2xl font-black text-emerald-500">Rp 0</span>
            </div>

            <button onclick="processOrder()" id="payBtn" class="w-full bg-emerald-500 text-zinc-950 font-black py-4 rounded-xl hover:bg-emerald-400 transition shadow-lg shadow-emerald-500/10">BAYAR SEKARANG</button>
            <button onclick="window.location.href = '/cart.html'" class="w-full text-center text-sm font-bold text-zinc-500 hover:text-zinc-300 mt-4 transition">&larr; Kembali ke Keranjang</button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const cart = JSON.parse(localStorage.getItem("thrift_cart")) || [];

      if (cart.length === 0) {
        alert("Keranjang kosong!");
        window.location.href = "/";
      }

      function renderCheckoutSummary() {
        const container = document.getElementById("checkoutItems");
        let subtotal = 0;
        container.innerHTML = cart
          .map((item) => {
            subtotal += item.price;
            return `<div class="flex justify-between text-sm"><span class="text-zinc-400 line-clamp-1 mr-4">${item.name}</span><span class="text-zinc-100 font-bold">Rp ${item.price.toLocaleString("id-ID")}</span></div>`;
          })
          .join("");

        const finalTotal = subtotal + 15000;
        document.getElementById("checkoutSubtotal").textContent = `Rp ${subtotal.toLocaleString("id-ID")}`;
        document.getElementById("checkoutTotal").textContent = `Rp ${finalTotal.toLocaleString("id-ID")}`;
      }

      function processOrder() {
        const form = document.getElementById("checkoutForm");
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }

        // Simpan data order ke localStorage dengan status awal
        const orderHistory = JSON.parse(localStorage.getItem("thrift_orders")) || [];
        const newOrder = {
          items: cart,
          total: document.getElementById("checkoutTotal").textContent,
          date: new Date().toLocaleDateString(),
          status: "pending_payment", // Status menunggu upload bukti
          paymentMethod: document.getElementById("paymentMethod").value, // Simpan metode terpilih
        };

        orderHistory.push(newOrder);
        localStorage.setItem("thrift_orders", JSON.stringify(orderHistory));

        // Arahkan ke halaman pembayaran
        window.location.href = "/payment.html";
      }

      renderCheckoutSummary();
    </script>
  </body>
</html>
