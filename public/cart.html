<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrift Lab - Keranjang Belanja</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-black tracking-tighter text-emerald-500 italic">THRIFT.LAB</a>
        <a href="/" class="text-sm font-bold text-zinc-400 hover:text-emerald-500 transition">&larr; Lanjut Belanja</a>
      </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 w-full flex-grow">
      <h2 class="text-3xl font-black mb-8 border-b border-zinc-800 pb-4">Keranjang Belanja <span id="cartCount" class="text-emerald-500 text-lg ml-2">(0)</span></h2>

      <div class="flex flex-col md:flex-row gap-8">
        <div class="w-full md:w-2/3 space-y-4" id="cartItemsContainer"></div>

        <div class="w-full md:w-1/3">
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 sticky top-24">
            <h3 class="font-bold text-lg mb-4 text-zinc-100">Ringkasan Pesanan</h3>
            <div class="flex justify-between text-sm text-zinc-400 mb-2">
              <span>Total Harga Barang</span>
              <span id="subtotalPrice" class="font-bold text-zinc-100">Rp 0</span>
            </div>
            <div class="border-t border-zinc-800 my-4"></div>
            <div class="flex justify-between items-center mb-6">
              <span class="font-bold">Total Estimasi</span>
              <span id="totalPrice" class="text-xl font-black text-emerald-500">Rp 0</span>
            </div>

            <button
              onclick="window.location.href = '/checkout.html'"
              id="checkoutBtn"
              disabled
              class="w-full bg-emerald-500 text-zinc-950 font-black py-3 rounded-xl disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-400 transition"
            >
              LANJUT CHECKOUT
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Mengambil data keranjang dari penyimpanan lokal browser
      let cart = JSON.parse(localStorage.getItem("thrift_cart")) || [];

      function renderCart() {
        const container = document.getElementById("cartItemsContainer");
        const countLabel = document.getElementById("cartCount");
        const subtotalLabel = document.getElementById("subtotalPrice");
        const totalLabel = document.getElementById("totalPrice");
        const checkoutBtn = document.getElementById("checkoutBtn");

        countLabel.textContent = `(${cart.length})`;

        if (cart.length === 0) {
          container.innerHTML = `
                    <div class="text-center py-12 bg-zinc-900 rounded-2xl border border-zinc-800 border-dashed">
                        <p class="text-zinc-500 mb-4">Keranjang kamu masih kosong nih.</p>
                        <button onclick="window.location.href='/'" class="bg-zinc-100 text-zinc-950 px-6 py-2 rounded-full font-bold hover:bg-emerald-500 transition">Cari Pakaian</button>
                    </div>`;
          subtotalLabel.textContent = "Rp 0";
          totalLabel.textContent = "Rp 0";
          checkoutBtn.disabled = true;
          return;
        }

        checkoutBtn.disabled = false;
        let total = 0;

        container.innerHTML = cart
          .map((item, index) => {
            total += item.price;
            return `
                <div class="flex gap-4 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl relative">
                    <img src="${item.image_url}" class="w-24 h-24 object-cover rounded-xl bg-zinc-800">
                    <div class="flex flex-col justify-center flex-grow">
                        <h4 class="font-bold text-zinc-100 line-clamp-1">${item.name}</h4>
                        <div class="flex gap-2 mt-1 mb-2">
                            <span class="text-[10px] font-bold bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded uppercase">${item.category}</span>
                            <span class="text-[10px] font-bold bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded">Size: ${item.size}</span>
                        </div>
                        <p class="font-black text-emerald-500">Rp ${item.price.toLocaleString("id-ID")}</p>
                    </div>
                    <button onclick="removeItem(${index})" class="absolute top-4 right-4 text-zinc-500 hover:text-red-500 transition" title="Hapus">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
                `;
          })
          .join("");

        subtotalLabel.textContent = `Rp ${total.toLocaleString("id-ID")}`;
        totalLabel.textContent = `Rp ${total.toLocaleString("id-ID")}`;
      }

      function removeItem(index) {
        cart.splice(index, 1);
        localStorage.setItem("thrift_cart", JSON.stringify(cart));
        renderCart();
      }

      renderCart();
    </script>
  </body>
</html>
