<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login Admin - Thrift Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white max-w-sm w-full rounded-2xl shadow-md border border-slate-200 p-6">
      <h1 class="text-2xl font-black text-center text-slate-800 mb-6">LOGIN ADMIN</h1>
      <div id="alert" class="hidden text-xs bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-center"></div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
          <input type="text" id="username" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
          <input type="password" id="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm transition">Masuk Dashboard</button>
      </form>
    </div>
    <script>
      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const alertBox = document.getElementById("alert");

        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = "/admin.html";
        } else {
          alertBox.textContent = data.message;
          alertBox.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
