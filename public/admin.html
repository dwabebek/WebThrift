<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thrift Lab - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col relative">
    <script>
      function getCurrentUser() {
        try {
          const currentUser = JSON.parse(localStorage.getItem("thrift_current_user")) || null;

          if (currentUser && currentUser.profile_photo) {
            delete currentUser.profile_photo;
            localStorage.setItem("thrift_current_user", JSON.stringify(currentUser));
          }

          if (currentUser && currentUser.username === "admin" && currentUser.role !== "admin") {
            currentUser.role = "admin";
            localStorage.setItem("thrift_current_user", JSON.stringify(currentUser));
          }

          return currentUser;
        } catch (error) {
          localStorage.removeItem("thrift_current_user");
          return null;
        }
      }

      const currentUser = getCurrentUser();

      if (!currentUser || currentUser.role !== "admin") {
        alert("Silakan login sebagai admin terlebih dahulu.");
        window.location.href = "/login.html";
      }

      function logoutAdmin() {
        localStorage.removeItem("thrift_current_user");
        window.location.href = "/login.html";
      }
    </script>

    <nav class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-tighter text-emerald-500 italic">THRIFT.LAB <span class="text-zinc-500 text-sm font-bold">/ ADMIN PANEL</span></h1>
        <div class="flex items-center gap-4">
          <a href="/" target="_blank" class="text-sm font-bold text-zinc-400 hover:text-emerald-500 transition">Lihat Katalog</a>
          <button onclick="logoutAdmin()" class="bg-red-500/10 text-red-500 border border-red-500/20 px-4 py-1.5 rounded-full text-sm font-bold hover:bg-red-500 hover:text-white transition">LOGOUT</button>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-10 w-full flex-grow space-y-12">
      <div>
        <div class="flex justify-between items-end mb-8">
          <div>
            <h2 class="text-3xl font-black text-zinc-100">Inventori Pakaian</h2>
            <p class="text-zinc-400 text-sm mt-1">Kelola stok barang, harga, dan ketersediaan.</p>
          </div>
          <button onclick="openModal()" class="bg-emerald-500 text-zinc-950 px-5 py-2.5 rounded-xl font-bold hover:bg-emerald-400 transition">+ Tambah Barang Baru</button>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl">
          <table class="w-full text-left border-collapse whitespace-nowrap">
            <thead>
              <tr class="bg-zinc-950/50 border-b border-zinc-800 text-xs uppercase text-zinc-500">
                <th class="p-5">Produk</th>
                <th class="p-5">Kategori & Size</th>
                <th class="p-5">Kondisi</th>
                <th class="p-5">Harga</th>
                <th class="p-5 text-center">Status</th>
                <th class="p-5 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="productTableBody" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2 class="text-2xl font-black text-emerald-500 mb-6">Notifikasi Pembayaran Masuk</h2>
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden">
          <table class="w-full text-left">
            <thead>
              <tr class="bg-zinc-950/50 text-xs uppercase text-zinc-500">
                <th class="p-5">Tanggal</th>
                <th class="p-5">Total</th>
                <th class="p-5">Bukti</th>
                <th class="p-5 text-center">Status</th>
                <th class="p-5 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="orderTableBody" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      </div>
    </main>

    <div id="productModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-2xl p-8 relative max-h-[90vh] overflow-y-auto">
        <h3 id="modalTitle" class="text-2xl font-black mb-6">Tambah Barang</h3>
        <form id="productForm" class="space-y-4">
          <input type="hidden" id="productId" />
          <input type="text" id="productName" required placeholder="Nama Barang" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-3 rounded-xl text-sm" />
          <div class="grid grid-cols-2 gap-4">
            <select id="productCategory" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-3 rounded-xl text-sm">
              <option value="baju">Baju</option>
              <option value="celana">Celana</option>
              <option value="sepatu">Sepatu</option>
              <option value="tas">Tas</option>
              <option value="topi">Topi</option>
              <option value="jaket">Jaket</option>
            </select>
            <input type="text" id="productSize" required placeholder="Size" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-3 rounded-xl text-sm" />
          </div>
          <input type="number" id="productPrice" required placeholder="Harga" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-3 rounded-xl text-sm" />
          <input type="text" id="productCondition" required placeholder="Kondisi" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-3 rounded-xl text-sm" />
          <div>
            <input type="file" id="productImageInput" accept="image/*" class="w-full bg-zinc-950 border border-zinc-700 px-4 py-2 rounded-xl text-sm" />
            <input type="hidden" id="productImageBase64" />
            <img id="imagePreview" class="mt-3 w-20 h-20 object-cover rounded-lg border hidden" />
          </div>
          <button type="submit" class="w-full bg-emerald-500 text-zinc-950 font-black py-3 rounded-xl">SIMPAN DATA</button>
        </form>
      </div>
    </div>

    <script>
      // --- LOGIKA DATA ---
      const productFallbackImage = "https://images.unsplash.com/photo-1445205170230-053b83016050?w=500&q=80";
      let productsCache = [];

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.success === false) {
          throw new Error(data.message || "Terjadi kesalahan pada server.");
        }

        return data;
      }

      async function loadProducts() {
        const data = await requestJson("/api/products");
        productsCache = Array.isArray(data.products) ? data.products : [];
        return productsCache;
      }

      function findProductById(id) {
        return productsCache.find((product) => Number(product.id) === Number(id));
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function loadOrders() {
        return JSON.parse(localStorage.getItem("thrift_orders")) || [];
      }
      function getOrderStatusClass(status) {
        if (status === "success") return "bg-emerald-500/10 text-emerald-500";
        if (status === "pending_verification") return "bg-amber-500/10 text-amber-500";
        return "bg-zinc-500/10 text-zinc-400";
      }
      function getOrderStatusLabel(status) {
        if (status === "success") return "SUCCESS";
        if (status === "pending_verification") return "MENUNGGU VERIFIKASI";
        if (status === "pending_payment") return "MENUNGGU BUKTI";
        return (status || "UNKNOWN").toUpperCase();
      }
      function getProductStatusLabel(status) {
        return String(status || "available")
          .replace(/_/g, " ")
          .toUpperCase();
      }

      // --- RENDER TABLE PRODUK ---
      async function renderTable() {
        const tableBody = document.getElementById("productTableBody");
        tableBody.innerHTML = `<tr><td colspan="6" class="p-5 text-center text-zinc-500">Memuat produk...</td></tr>`;

        try {
          const products = await loadProducts();

          if (products.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" class="p-5 text-center text-zinc-500">Belum ada produk.</td></tr>`;
            return;
          }

          tableBody.innerHTML = products
            .map((p) => {
              const status = p.status || "available";
              const statusClass = status === "available" ? "bg-emerald-500/10 text-emerald-500" : "bg-red-500/10 text-red-500";
              const imageUrl = p.image_url || productFallbackImage;

              return `
                <tr class="hover:bg-zinc-950/50">
                    <td class="p-5 flex items-center gap-4"><img src="${escapeHtml(imageUrl)}" class="w-12 h-12 rounded-lg object-cover bg-zinc-800"><span class="font-bold">${escapeHtml(p.name)}</span></td>
                    <td class="p-5">${escapeHtml(String(p.category || "-").toUpperCase())} / ${escapeHtml(p.size || "-")}</td>
                    <td class="p-5">${escapeHtml(p.condition || "-")}</td>
                    <td class="p-5 font-black text-emerald-500">Rp ${Number(p.price || 0).toLocaleString("id-ID")}</td>
                    <td class="p-5 text-center"><span class="px-2 py-1 rounded text-[10px] font-bold ${statusClass}">${escapeHtml(getProductStatusLabel(status))}</span></td>
                    <td class="p-5 text-right"><button onclick="editProduct(${Number(p.id)})" class="text-zinc-400 hover:text-emerald-500 mr-3">Edit</button><button onclick="deleteProduct(${Number(p.id)})" class="text-zinc-400 hover:text-red-500">Hapus</button></td>
                </tr>
            `;
            })
            .join("");
        } catch (error) {
          tableBody.innerHTML = `<tr><td colspan="6" class="p-5 text-center text-red-500">${escapeHtml(error.message)}</td></tr>`;
        }
      }

      // --- RENDER ORDER (FITUR BARU) ---
      function renderOrders() {
        const orders = loadOrders();
        document.getElementById("orderTableBody").innerHTML = orders
          .map(
            (o, index) => `
                <tr class="hover:bg-zinc-950/50">
                    <td class="p-5">${o.date}</td>
                    <td class="p-5 font-bold">${o.total}</td>
                    <td class="p-5">${o.proof ? `<img src="${o.proof}" alt="Bukti pembayaran" class="w-12 h-12 rounded cursor-pointer object-cover" onclick="window.open(this.src)">` : `<span class="text-xs font-bold text-zinc-500">Belum upload</span>`}</td>
                    <td class="p-5 text-center"><span class="px-2 py-1 rounded text-[10px] font-bold ${getOrderStatusClass(o.proof ? o.status : "pending_payment")}">${getOrderStatusLabel(o.proof ? o.status : "pending_payment")}</span></td>
                    <td class="p-5 text-right">
                        ${o.status === "pending_verification" && o.proof ? `<button onclick="verifyOrder(${index}, this)" class="text-emerald-500 font-bold hover:underline disabled:cursor-not-allowed disabled:text-zinc-500">Verifikasi</button>` : "-"}
                    </td>
                </tr>
            `,
          )
          .join("");
      }

      function getOrderProductIds(order) {
        return [
          ...new Set(
            (order.items || [])
              .map((item) => Number(item.id))
              .filter((id) => Number.isFinite(id)),
          ),
        ];
      }

      async function markOrderProductsSoldOut(order) {
        const productIds = getOrderProductIds(order);

        if (productIds.length === 0) {
          throw new Error("Produk pada order tidak ditemukan.");
        }

        await Promise.all(
          productIds.map((id) =>
            requestJson(`/api/products/${encodeURIComponent(id)}/status`, {
              method: "PUT",
              body: JSON.stringify({ status: "sold_out" }),
            }),
          ),
        );
      }

      async function verifyOrder(index, button) {
        const orders = loadOrders();
        const order = orders[index];

        if (!order) {
          alert("Order tidak ditemukan.");
          return;
        }

        if (button) {
          button.disabled = true;
          button.textContent = "Memverifikasi...";
        }

        try {
          await markOrderProductsSoldOut(order);

          orders[index].status = "success";
          orders[index].verifiedAt = new Date().toLocaleString("id-ID");
          localStorage.setItem("thrift_orders", JSON.stringify(orders));

          renderOrders();
          await renderTable();
          alert("Pembayaran berhasil diverifikasi. Produk sudah ditandai sold out.");
        } catch (error) {
          alert(error.message);

          if (button) {
            button.disabled = false;
            button.textContent = "Verifikasi";
          }
        }
      }

      // --- FUNGSI MODAL & FORM (FITUR LAMA) ---
      document.getElementById("productImageInput").addEventListener("change", function (e) {
        if (!e.target.files[0]) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
          document.getElementById("productImageBase64").value = ev.target.result;
          document.getElementById("imagePreview").src = ev.target.result;
          document.getElementById("imagePreview").classList.remove("hidden");
        };
        reader.readAsDataURL(e.target.files[0]);
      });

      document.getElementById("productForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = document.getElementById("productId").value;
        const existingProduct = id ? findProductById(id) : null;
        const submitButton = e.currentTarget.querySelector('button[type="submit"]');
        const item = {
          name: document.getElementById("productName").value,
          category: document.getElementById("productCategory").value,
          size: document.getElementById("productSize").value,
          price: parseInt(document.getElementById("productPrice").value),
          condition: document.getElementById("productCondition").value,
          image_url: document.getElementById("productImageBase64").value || productFallbackImage,
          status: existingProduct ? existingProduct.status || "available" : "available",
        };

        submitButton.disabled = true;
        submitButton.textContent = "MENYIMPAN...";

        try {
          if (id) {
            await requestJson(`/api/products/${encodeURIComponent(id)}`, {
              method: "PUT",
              body: JSON.stringify(item),
            });
          } else {
            await requestJson("/api/products", {
              method: "POST",
              body: JSON.stringify(item),
            });
          }

          closeModal();
          await renderTable();
        } catch (error) {
          alert(error.message);
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "SIMPAN DATA";
        }
      });

      function editProduct(id) {
        const p = findProductById(id);

        if (!p) {
          alert("Produk tidak ditemukan.");
          return;
        }

        document.getElementById("modalTitle").textContent = "Edit Barang";
        document.getElementById("productId").value = p.id;
        document.getElementById("productName").value = p.name;
        document.getElementById("productCategory").value = p.category;
        document.getElementById("productSize").value = p.size;
        document.getElementById("productPrice").value = p.price;
        document.getElementById("productCondition").value = p.condition;
        document.getElementById("productImageBase64").value = p.image_url;
        document.getElementById("imagePreview").src = p.image_url;
        document.getElementById("imagePreview").classList.remove("hidden");
        document.getElementById("productModal").classList.remove("hidden");
      }

      async function deleteProduct(id) {
        if (!confirm("Hapus barang?")) return;

        try {
          await requestJson(`/api/products/${encodeURIComponent(id)}`, {
            method: "DELETE",
          });
          await renderTable();
        } catch (error) {
          alert(error.message);
        }
      }
      function openModal() {
        document.getElementById("modalTitle").textContent = "Tambah Barang";
        document.getElementById("productForm").reset();
        document.getElementById("productId").value = "";
        document.getElementById("productImageBase64").value = "";
        document.getElementById("imagePreview").src = "";
        document.getElementById("imagePreview").classList.add("hidden");
        document.getElementById("productModal").classList.remove("hidden");
      }
      function closeModal() {
        document.getElementById("productModal").classList.add("hidden");
      }
      window.onload = () => {
        renderTable();
        renderOrders();
      };
    </script>
  </body>
</html>
